           1. HỆ THỐNG ÂM THANH VUI NHỘN (WEB AUDIO API - KHÔNG CẦN FILE NGOÀI)
           ========================================================================== */
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('sound-toggle');
            btn.textContent = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled) {
                initAudio();
                playClickSound();
            }
        }

        function playTone(freq, type, duration, startTime = 0, vol = 0.15) {
            if (!soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime + startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + startTime);
                osc.stop(audioCtx.currentTime + startTime + duration);
            } catch (e) {
                // Bỏ qua nếu trình duyệt chặn autoplay
            }
        }

        function playClickSound() {
            playTone(540, 'sine', 0.08, 0, 0.1);
        }

        function playCorrectSound() {
            playTone(523.25, 'triangle', 0.15, 0, 0.18);
            playTone(659.25, 'triangle', 0.15, 0.08, 0.18);
            playTone(783.99, 'triangle', 0.15, 0.16, 0.18);
            playTone(1046.50, 'triangle', 0.35, 0.24, 0.2);
        }

        function playWrongSound() {
            playTone(260, 'sawtooth', 0.18, 0, 0.12);
            playTone(210, 'sawtooth', 0.28, 0.14, 0.12);
        }

        function playVictorySound() {
            const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
            const times = [0, 0.12, 0.24, 0.36, 0.52, 0.66];
            notes.forEach((n, i) => playTone(n, 'triangle', 0.25, times[i], 0.2));

            document.getElementById('modal-emoji').textContent = emoji;

            const modal = document.getElementById('custom-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            playClickSound();
            const modal = document.getElementById('custom-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function navigateTo(screen) {
            playClickSound();
            state.currentScreen = screen;
            const homeBtn = document.getElementById('home-btn');
            if (screen === 'home') {

                homeBtn.classList.remove('hidden');

            else if (screen === 'study') renderStudyCorner();
            else if (screen === 'game1') startSortingGame();
            else if (screen === 'game2') startSentenceGame();

        function startSortingGame() {
            // Chọn ngẫu nhiên 10 từ từ kho từ vựng
            state.sortItems = shuffleArray(WORD_SORT_POOL).slice(0, 10);
            state.sortIndex = 0;
            state.sortScore = 0;
            renderSortingGame();
        }

        function renderSortingGame() {
            const container = document.getElementById('app-container');

            // Màn hình hoàn thành Thử thách 1
            if (state.sortIndex >= state.sortItems.length) {
                playVictorySound();
                triggerConfetti();
                addStars(state.sortScore * 2);

                                Qua Thử thách 2 ➡️
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            const currentWord = state.sortItems[state.sortIndex];
            const progressPercent = Math.round((state.sortIndex / state.sortItems.length) * 100);

            container.innerHTML = `
                <div class="animate-pop">
                    <!-- Thanh tiến trình -->
                    <div class="bg-white/90 rounded-2xl p-4 mb-6 shadow-sm border-2 border-sky-200 flex items-center justify-between gap-4">
                        <div class="font-display font-extrabold text-sky-800 text-base sm:text-lg">

                        <div class="flex-grow bg-slate-200 h-4 rounded-full overflow-hidden max-w-md">

                        </div>
                        <div class="font-display font-extrabold text-emerald-600 text-base sm:text-lg">
                            Đúng: ${state.sortScore}

                    </div>

                    <div class="text-center mb-8">

                             ondragstart="handleDragStart(event)"

                                    ondragover="handleDragOver(event)"
                                    ondragleave="handleDragLeave(event)"
                                    ondrop="handleDrop(event, '${basket.id}')"

        function handleDragStart(e) {
            e.dataTransfer.setData('text/plain', 'word');
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drop-zone-active');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drop-zone-active');
        }

        function handleDrop(e, basketId) {
            e.preventDefault();
            e.currentTarget.classList.remove('drop-zone-active');
            checkSortAnswer(basketId);
        }

        let isCheckingSort = false;
        function checkSortAnswer(selectedBasketId) {
            if (isCheckingSort) return;
            const currentWord = state.sortItems[state.sortIndex];
            const cardEl = document.getElementById('draggable-word-card');
            const feedbackEl = document.getElementById('sort-feedback');

            if (selectedBasketId === currentWord.type) {
                isCheckingSort = true;
                playCorrectSound();
                state.sortScore++;
                cardEl.classList.remove('border-amber-400');
                cardEl.classList.add('border-emerald-500', 'bg-emerald-50', 'scale-105');
                feedbackEl.innerHTML = `<span class="text-emerald-600">✅ Chính xác! ${currentWord.reason}</span>`;

                setTimeout(() => {
                    state.sortIndex++;
                    isCheckingSort = false;
                    renderSortingGame();
                }, 1150);
            } else {
                playWrongSound();
                cardEl.classList.remove('animate-shake');
                void cardEl.offsetWidth;
                cardEl.classList.add('animate-shake', 'border-rose-500');
                feedbackEl.innerHTML = `<span class="text-rose-600">❌ Chưa đúng rồi! Bé hãy thử lại nhé!</span>`;
                setTimeout(() => {
                    cardEl.classList.remove('border-rose-500');
                }, 600);
            }
        }

        /* ==========================================================================
           7. THỬ THÁCH 2: CHUYÊN GIA CÂU "AI LÀ GÌ?" (ĐIỀN TỪ & GHÉP MẢNH TỪ)
           ========================================================================== */
        function startSentenceGame() {
            state.sentenceList = shuffleArray(SENTENCE_CHALLENGES);
            state.sentenceIndex = 0;
            state.sentenceScore = 0;
            setupCurrentSentenceChallenge();
        }

        function setupCurrentSentenceChallenge() {
            state.sentenceAnswered = false;
            const item = state.sentenceList[state.sentenceIndex];
            if (item && item.type === 'arrange') {
                state.arrangedWords = [];
                let shuffled = shuffleArray(item.pieces);
                if (shuffled.join(' ') === item.pieces.join(' ') && item.pieces.length > 1) {
                    shuffled = [...item.pieces].reverse();
                }
                state.availablePieces = shuffled.map((text, idx) => ({ id: idx, text, used: false }));
            }
            renderSentenceGame();
        }

        function renderSentenceGame() {
            const container = document.getElementById('app-container');

            if (state.sentenceIndex >= state.sentenceList.length) {
                playVictorySound();
                triggerConfetti();
                addStars(state.sentenceScore * 3);
                container.innerHTML = `
                    <div class="bg-white/95 rounded-3xl p-8 text-center shadow-xl border-4 border-amber-300 max-w-xl mx-auto animate-pop">
                        <div class="text-7xl mb-4 animate-bounce">🌟</div>
                        <h2 class="font-display font-black text-3xl text-amber-700 mb-2">Chuyên Gia Xuất Sắc!</h2>
                        <p class="text-slate-600 font-bold text-lg mb-6">
                            Bé đã hoàn thành <span class="text-emerald-600 text-2xl font-black">${state.sentenceScore}/${state.sentenceList.length}</span> câu nêu hoạt động "Ai làm gì?"!
                        </p>
                        <div class="bg-amber-100 border-2 border-amber-300 rounded-2xl p-4 mb-6 inline-block">
                            <span class="font-display font-black text-amber-800 text-xl">+${state.sentenceScore * 3} ⭐ Ngôi sao thưởng!</span>
                        </div>
                        <div class="flex flex-col sm:flex-row gap-3 justify-center">
                            <button onclick="startSentenceGame()" class="px-6 py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-display font-bold rounded-2xl btn-3d text-lg">
                                🔄 Chơi lại
                            </button>
                            <button onclick="navigateTo('game3')" class="px-6 py-3.5 bg-purple-600 hover:bg-purple-700 text-white font-display font-bold rounded-2xl btn-3d text-lg">
                                Qua Thử thách 3 🏆
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            const item = state.sentenceList[state.sentenceIndex];
            const progressPercent = Math.round((state.sentenceIndex / state.sentenceList.length) * 100);

            let challengeHtml = '';

            if (item.type === 'fill') {
                // Phần A: Điền từ chỉ hoạt động thích hợp vào chỗ trống
                const shuffledOpts = item._shuffledOpts || (item._shuffledOpts = shuffleArray(item.options));
                challengeHtml = `
                    <div class="bg-amber-50 border-3 border-amber-300 rounded-2xl p-5 my-5 text-center font-display font-extrabold text-xl sm:text-2xl text-slate-800 leading-relaxed">
                        <span>${item.sentenceBefore}</span>
                        <span id="fill-blank-slot" class="inline-block min-w-[110px] px-4 py-1 mx-1.5 bg-white border-b-4 border-emerald-500 rounded-xl text-emerald-700">......</span>
                        <span>${item.sentenceAfter}</span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5 mt-4">
                        ${shuffledOpts.map((opt, idx) => `
                            <button id="sent-opt-${idx}" onclick="checkFillSentence(${idx})"
                                    class="p-4 rounded-2xl bg-sky-50 hover:bg-sky-100 border-3 border-sky-200 font-display font-black text-lg sm:text-xl text-slate-800 btn-3d text-center">
                                ${opt.text}
                            </button>
                        `).join('')}
                    </div>
                `;
            } else {
                // Phần B: Ghép mảnh từ tạo câu nêu hoạt động hoàn chỉnh
                challengeHtml = `
                    <div class="mt-4">
                        <div class="inline-block bg-amber-100 text-amber-800 font-bold px-3.5 py-1 rounded-full text-sm mb-4">
                            💡 Gợi ý: ${item.hint}
                        </div>

                        <!-- Khung chứa câu bé đang ghép -->
                        <div class="min-h-[82px] bg-slate-100 border-3 border-dashed border-amber-400 rounded-2xl p-3.5 flex flex-wrap items-center justify-center gap-2.5 mb-5">
                            ${state.arrangedWords.length === 0
                                ? `<span class="text-slate-400 font-bold text-base">Chạm vào các mảnh từ bên dưới để xếp thành câu...</span>`
                                : state.arrangedWords.map((piece, idx) => `
                                    <button onclick="removeWordPiece(${idx})" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-display font-black text-lg sm:text-xl px-4 py-2.5 rounded-xl btn-3d">
                                        ${piece.text}
                                    </button>
                                `).join('')
                            }
                        </div>

                        <!-- Các mảnh từ rời -->
                        <div class="flex flex-wrap items-center justify-center gap-3 mb-6">
                            ${state.availablePieces.map(piece => `
                                <button onclick="selectWordPiece(${piece.id})"
                                        ${piece.used ? 'disabled' : ''}
                                        class="${piece.used ? 'opacity-30 cursor-not-allowed bg-slate-200 text-slate-400' : 'bg-white hover:bg-sky-50 text-sky-800 border-2 border-sky-300 btn-3d'} font-display font-black text-lg sm:text-xl px-5 py-3 rounded-2xl">
                                    ${piece.text}
                                </button>
                            `).join('')}
                        </div>

                        <div class="flex justify-center gap-3">
                            <button onclick="clearArrangedWords()" class="px-5 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-display font-bold rounded-2xl btn-3d">
                                ↺ Xếp lại
                            </button>
                            <button onclick="checkArrangedSentence()" class="px-7 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-display font-black text-lg rounded-2xl btn-3d">
                                Kiểm tra câu ✅
                            </button>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="animate-pop max-w-3xl mx-auto">
                    <!-- Thanh tiến độ -->
                    <div class="bg-white/90 rounded-2xl p-4 mb-6 shadow-sm border-2 border-amber-200 flex items-center justify-between gap-4">
                        <div class="font-display font-extrabold text-amber-800 text-base sm:text-lg">
                            🧩 Câu <span class="text-amber-600">${state.sentenceIndex + 1}</span>/${state.sentenceList.length}
                        </div>
                        <div class="flex-grow bg-slate-200 h-4 rounded-full overflow-hidden max-w-md">
                            <div class="bg-gradient-to-r from-amber-400 to-orange-500 h-full transition-all duration-300" style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="font-display font-extrabold text-emerald-600 text-base sm:text-lg">
                            Điểm: ${state.sentenceScore}
                        </div>
                    </div>

                    <!-- Khung câu hỏi chính -->
                    <div class="bg-white/95 rounded-3xl p-6 sm:p-8 shadow-xl border-4 border-amber-300">
                        <span class="inline-block bg-orange-100 text-orange-700 font-extrabold text-xs uppercase tracking-wider px-3 py-1 rounded-full mb-2">
                            ${item.type === 'fill' ? 'Phần A • Điền từ chỉ hoạt động' : 'Phần B • Ghép câu Ai làm gì?'}
                        </span>
                        <h3 class="font-display font-black text-xl sm:text-2xl text-slate-800 leading-snug">
                            ${item.prompt}
                        </h3>

                        ${challengeHtml}

                        <!-- Khu vực phản hồi & nút tiếp theo -->
                        <div id="sentence-feedback-box" class="hidden mt-6 p-4 rounded-2xl border-2"></div>
                    </div>
                </div>
            `;
        }

        function checkFillSentence(optIdx) {
            if (state.sentenceAnswered) return;
            const item = state.sentenceList[state.sentenceIndex];
            const chosen = item._shuffledOpts[optIdx];
            const btn = document.getElementById(`sent-opt-${optIdx}`);
            const slot = document.getElementById('fill-blank-slot');
            const fbBox = document.getElementById('sentence-feedback-box');

            state.sentenceAnswered = true;
            fbBox.classList.remove('hidden');
            slot.textContent = chosen.text;

            if (chosen.isCorrect) {
                playCorrectSound();
                state.sentenceScore++;
                slot.classList.add('bg-emerald-100', 'text-emerald-800');
                btn.classList.remove('bg-sky-50', 'border-sky-200');
                btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                fbBox.className = 'mt-6 p-4 rounded-2xl border-2 bg-emerald-50 border-emerald-300 text-emerald-800';
                fbBox.innerHTML = `
                    <p class="font-display font-black text-lg mb-1">🎉 Chính xác! Hoan hô bé!</p>
                    <p class="font-semibold text-sm sm:text-base mb-3">${item.explanation}</p>
                    <button onclick="nextSentenceChallenge()" class="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-display font-bold rounded-xl btn-3d">
                        Câu tiếp theo ➡️
                    </button>
                `;
            } else {
                playWrongSound();
                slot.classList.add('bg-rose-100', 'text-rose-800');
                btn.classList.remove('bg-sky-50', 'border-sky-200');
                btn.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900', 'animate-shake');
                fbBox.className = 'mt-6 p-4 rounded-2xl border-2 bg-rose-50 border-rose-300 text-rose-800';
                fbBox.innerHTML = `
                    <p class="font-display font-black text-lg mb-1">😅 Chưa đúng rồi!</p>
                    <p class="font-semibold text-sm sm:text-base mb-3">${item.explanation}</p>
                    <button onclick="nextSentenceChallenge()" class="px-6 py-2.5 bg-sky-500 hover:bg-sky-600 text-white font-display font-bold rounded-xl btn-3d">
                        Tiếp tục ➡️
                    </button>
                `;
            }
        }

        function selectWordPiece(id) {
            if (state.sentenceAnswered) return;
            playClickSound();
            const piece = state.availablePieces.find(p => p.id === id);
            if (piece && !piece.used) {
                piece.used = true;
                state.arrangedWords.push(piece);
                renderSentenceGame();
            }
        }

        function removeWordPiece(arrangedIdx) {
            if (state.sentenceAnswered) return;
            playClickSound();
            const removed = state.arrangedWords.splice(arrangedIdx, 1)[0];
            const orig = state.availablePieces.find(p => p.id === removed.id);
            if (orig) orig.used = false;
            renderSentenceGame();
        }

        function clearArrangedWords() {
            if (state.sentenceAnswered) return;
            playClickSound();
            state.arrangedWords = [];
            state.availablePieces.forEach(p => p.used = false);
            renderSentenceGame();
        }

        function checkArrangedSentence() {
            if (state.sentenceAnswered) return;
            const item = state.sentenceList[state.sentenceIndex];
            if (state.arrangedWords.length < item.pieces.length) {
                showModal('🧩', 'Chưa đủ mảnh từ!', 'Bé hãy chọn hết tất cả các mảnh từ bên dưới để ghép thành câu hoàn chỉnh nhé!');
                return;
            }

            const userSentence = state.arrangedWords.map(p => p.text).join(' ');
            const fbBox = document.getElementById('sentence-feedback-box');
            fbBox.classList.remove('hidden');

            if (userSentence === item.correctSentence) {
                state.sentenceAnswered = true;
                playCorrectSound();
                state.sentenceScore++;
                fbBox.className = 'mt-6 p-4 rounded-2xl border-2 bg-emerald-50 border-emerald-300 text-emerald-800';
                fbBox.innerHTML = `
                    <p class="font-display font-black text-lg mb-1">🎉 Giỏi quá! Bé ghép đúng câu: "${item.correctSentence}"</p>
                    <button onclick="nextSentenceChallenge()" class="mt-2 px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-display font-bold rounded-xl btn-3d">
                        Câu tiếp theo ➡️
                    </button>
                `;
            } else {
                playWrongSound();
                fbBox.className = 'mt-6 p-4 rounded-2xl border-2 bg-rose-50 border-rose-300 text-rose-800 animate-shake';
                fbBox.innerHTML = `
                    <p class="font-display font-black text-lg">❌ Thứ tự chưa hợp lý lắm! Bé bấm "Xếp lại" và thử sắp xếp theo mẫu "Ai / làm gì?" nhé.</p>
                `;
            }
        }

        function nextSentenceChallenge() {
            playClickSound();
            state.sentenceIndex++;
            if (state.sentenceIndex < state.sentenceList.length) {
                setupCurrentSentenceChallenge();
            } else {
                renderSentenceGame();
            }
        }

        /* ==========================================================================
           8. THỬ THÁCH 3: ĐẤU TRƯỜNG TRẮC NGHIỆM (10 CÂU + STREAK + TRAO CÚP)
           ========================================================================== */
        function startQuizGame() {
            state.quizList = shuffleArray(QUIZ_BANK).slice(0, 10);
            state.quizIndex = 0;
            state.quizScore = 0;
            state.quizStreak = 0;
            state.quizMaxStreak = 0;
            state.quizAnswered = false;
            renderQuizGame();
        }

        function renderQuizGame() {
            const container = document.getElementById('app-container');

            // Màn hình trao cúp / huy hiệu tổng kết
            if (state.quizIndex >= state.quizList.length) {
                playVictorySound();
                triggerConfetti();
                const bonusStars = state.quizScore * 3 + state.quizMaxStreak;
                addStars(bonusStars);

                let badgeIcon = '🥉';
                let badgeTitle = 'Huy Hiệu Đồng Chăm Chỉ';
                let badgeDesc = 'Bé đã hoàn thành đấu trường! Ôn thêm một chút để đạt Cúp Vàng nhé!';

                if (state.quizScore >= 9) {
                    badgeIcon = '🏆';
                    badgeTitle = 'Cúp Vàng Trạng Nguyên Nhí';
                    badgeDesc = 'Quá xuất sắc! Bé nắm vững kiến thức về Từ chỉ hoạt động như một Trạng Nguyên!';
                } else if (state.quizScore >= 7) {
                    badgeIcon = '🥈';
                    badgeTitle = 'Huy Hiệu Bạc Thông Thái';
                    badgeDesc = 'Rất giỏi! Bé đã trả lời đúng hầu hết các câu hỏi!';
                }

                container.innerHTML = `
                    <div class="bg-white/95 rounded-3xl p-7 sm:p-10 text-center shadow-2xl border-4 border-fuchsia-300 max-w-xl mx-auto animate-pop">
                        <div class="text-8xl mb-3 animate-float">${badgeIcon}</div>
                        <div class="inline-block bg-fuchsia-100 text-fuchsia-800 font-extrabold px-4 py-1 rounded-full text-sm mb-2">
                            Danh hiệu đạt được
                        </div>
                        <h2 class="font-display font-black text-2xl sm:text-3xl text-fuchsia-700 mb-2">${badgeTitle}</h2>
                        <p class="text-slate-600 font-semibold mb-6">${badgeDesc}</p>

                        <div class="grid grid-cols-3 gap-3 mb-6">
                            <div class="bg-sky-50 border-2 border-sky-200 rounded-2xl p-3">
                                <div class="text-xs font-bold text-sky-600 uppercase">Số câu đúng</div>
                                <div class="font-display font-black text-2xl text-sky-800">${state.quizScore}/10</div>
                            </div>
                            <div class="bg-orange-50 border-2 border-orange-200 rounded-2xl p-3">
                                <div class="text-xs font-bold text-orange-600 uppercase">Chuỗi đúng</div>
                                <div class="font-display font-black text-2xl text-orange-700">🔥 ${state.quizMaxStreak}</div>
                            </div>
                            <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-3">
                                <div class="text-xs font-bold text-amber-600 uppercase">Sao thưởng</div>
                                <div class="font-display font-black text-2xl text-amber-700">+${bonusStars} ⭐</div>
                            </div>
                        </div>

                        <div class="flex flex-col sm:flex-row gap-3 justify-center">
                            <button onclick="startQuizGame()" class="px-6 py-3.5 bg-fuchsia-600 hover:bg-fuchsia-700 text-white font-display font-bold rounded-2xl btn-3d text-lg">
                                🔄 Thi đấu lại
                            </button>
                            <button onclick="navigateTo('home')" class="px-6 py-3.5 bg-sky-500 hover:bg-sky-600 text-white font-display font-bold rounded-2xl btn-3d text-lg">
                                🏠 Về Trang chủ
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            const qItem = state.quizList[state.quizIndex];
            const progressPercent = Math.round((state.quizIndex / state.quizList.length) * 100);

            container.innerHTML = `
                <div class="animate-pop max-w-3xl mx-auto">
                    <!-- Thanh trạng thái Đấu trường -->
                    <div class="bg-white/90 rounded-2xl p-4 mb-6 shadow-sm border-2 border-fuchsia-200 flex flex-wrap items-center justify-between gap-3">
                        <div class="font-display font-extrabold text-fuchsia-800 text-base sm:text-lg">
                            🏆 Câu <span class="text-fuchsia-600">${state.quizIndex + 1}</span>/10
                        </div>
                        <div class="flex-grow bg-slate-200 h-4 rounded-full overflow-hidden max-w-xs sm:max-w-md">
                            <div class="bg-gradient-to-r from-fuchsia-500 to-purple-600 h-full transition-all duration-300" style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="bg-orange-100 text-orange-700 border border-orange-300 px-3 py-1 rounded-full font-display font-black text-sm">
                                🔥 Chuỗi: ${state.quizStreak}
                            </span>
                            <span class="font-display font-extrabold text-emerald-600 text-base sm:text-lg">
                                Điểm: ${state.quizScore}
                            </span>
                        </div>
                    </div>

                    <!-- Thẻ câu hỏi trắc nghiệm -->
                    <div class="bg-white/95 rounded-3xl p-6 sm:p-8 shadow-xl border-4 border-fuchsia-300">
                        <h3 class="font-display font-black text-xl sm:text-2xl text-slate-800 mb-6 leading-snug">
                            ${qItem.q}
                        </h3>

                        <div class="space-y-3.5">
                            ${qItem.options.map((opt, idx) => `
                                <button id="quiz-opt-${idx}" onclick="checkQuizAnswer(${idx})"
                                        class="w-full text-left p-4 sm:p-5 rounded-2xl bg-purple-50 hover:bg-purple-100 border-3 border-purple-200 font-display font-bold text-base sm:text-xl text-slate-800 btn-3d flex items-center gap-3.5">
                                    <span class="w-10 h-10 rounded-xl bg-fuchsia-600 text-white flex items-center justify-center font-black shrink-0">${['A', 'B', 'C'][idx]}</span>
                                    <span>${opt}</span>
                                </button>
                            `).join('')}
                        </div>

                        <!-- Giải thích sau khi chọn -->
                        <div id="quiz-feedback" class="hidden mt-6 p-4 rounded-2xl border-2"></div>
                    </div>
                </div>
            `;
        }

        function checkQuizAnswer(selectedIdx) {
            if (state.quizAnswered) return;
            state.quizAnswered = true;

            const qItem = state.quizList[state.quizIndex];
            const isCorrect = selectedIdx === qItem.answer;
            const fbBox = document.getElementById('quiz-feedback');
            fbBox.classList.remove('hidden');

            qItem.options.forEach((_, idx) => {
                const btn = document.getElementById(`quiz-opt-${idx}`);
                btn.classList.remove('bg-purple-50', 'hover:bg-purple-100', 'border-purple-200');
                if (idx === qItem.answer) {
                    btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                } else if (idx === selectedIdx && !isCorrect) {
                    btn.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900', 'animate-shake');
                } else {
                    btn.classList.add('opacity-50', 'bg-slate-100', 'border-slate-200');
                }
            });

            if (isCorrect) {
                playCorrectSound();
                state.quizScore++;
                state.quizStreak++;
                if (state.quizStreak > state.quizMaxStreak) {
                    state.quizMaxStreak = state.quizStreak;
                }
                fbBox.className = 'mt-6 p-4 rounded-2xl border-2 bg-emerald-50 border-emerald-300 text-emerald-800';
                fbBox.innerHTML = `
                    <p class="font-display font-black text-lg mb-1">🎉 Chính xác! ${state.quizStreak >= 3 ? `Chuỗi ${state.quizStreak} câu đúng liên tiếp! 🔥` : ''}</p>
                    <p class="font-semibold text-sm sm:text-base mb-3">${qItem.explain}</p>
                    <button onclick="nextQuizQuestion()" class="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-display font-bold rounded-xl btn-3d">
                        ${state.quizIndex === 9 ? 'Xem kết quả 🏆' : 'Câu tiếp theo ➡️'}
                    </button>
                `;
            } else {
                playWrongSound();
                state.quizStreak = 0;
                fbBox.className = 'mt-6 p-4 rounded-2xl border-2 bg-rose-50 border-rose-300 text-rose-800';
                fbBox.innerHTML = `
                    <p class="font-display font-black text-lg mb-1">😅 Tiếc quá, chưa đúng rồi!</p>
                    <p class="font-semibold text-sm sm:text-base mb-3">${qItem.explain}</p>
                    <button onclick="nextQuizQuestion()" class="px-6 py-2.5 bg-fuchsia-600 hover:bg-fuchsia-700 text-white font-display font-bold rounded-xl btn-3d">
                        ${state.quizIndex === 9 ? 'Xem kết quả 🏆' : 'Câu tiếp theo ➡️'}
                    </button>
                `;
            }
        }

        function nextQuizQuestion() {
            playClickSound();
            state.quizIndex++;
            state.quizAnswered = false;
            renderQuizGame();
        }

        // Khởi chạy ứng dụng khi tải trang xong
        window.onload = function () {
            document.getElementById('total-stars').textContent = state.totalStars;
            renderHome();
        };
    </script>
</body>
</html>
